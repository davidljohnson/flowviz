<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowViz</title>
    <script>
      // Resolve the theme before first paint. React reads the same key on
      // mount; doing it here as well is what keeps a light-mode user from
      // seeing a dark flash while the bundle loads.
      (function () {
        try {
          var stored = localStorage.getItem('theme_mode');
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode;
          document.documentElement.style.backgroundColor =
            mode === 'light' ? '#eef1f6' : '#0d1117';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
